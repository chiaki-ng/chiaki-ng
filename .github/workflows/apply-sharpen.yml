name: Apply sharpening option

on:
  push:
    branches: [feature/sharpening]
    paths:
      - ".github/workflows/apply-sharpen.yml"
      - "tools/apply_sharpen.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_sharpen.py .
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add sharpening option (Off/Low/Medium/High)"
          git push
