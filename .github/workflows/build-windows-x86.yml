name: Build chiaki-ng Windows x86_64 (VC)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/happy-gauss-7i9rwm

jobs:
  build-win_x64:
    name: Build chiaki-ng win_x64 (VC)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      # vcpkg 2026.10.16; the older baseline points at MSYS2 packages that were removed from the mirrors
      vcpkg_baseline: 9eec002df1cd109f8f104cd966a763daf9751489
      dep_folder: deps
      libplacebo_tag: v7.360.1
      # The pinned vcpkg ports (e.g. json-c) still declare cmake_minimum_required < 3.5,
      # which the runner's CMake 4.x rejects unless a policy minimum is set.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM
      sdl2_compat_tag: 2.32.64

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = (Invoke-WebRequest -UseBasicParsing -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows
          echo Version $ver
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'
          cache: true

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -OutFile ".\ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Expand-Archive -LiteralPath "ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n7.1-latest-win64-gpl-shared-7.1" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc
        run: |
          # The shaderc badge download links are gone; use the shaderc shipped with the Vulkan SDK.
          $deps = "${{ github.workspace }}\${{ env.dep_folder }}"
          New-Item -ItemType Directory -Force -Path "$deps\bin", "$deps\lib\pkgconfig", "$deps\include" | Out-Null
          Copy-Item "${{ env.VULKAN_SDK }}Bin\shaderc_shared.dll" "$deps\bin" -Force
          Copy-Item "${{ env.VULKAN_SDK }}Lib\shaderc_shared.lib" "$deps\lib" -Force
          Copy-Item "${{ env.VULKAN_SDK }}Include\shaderc" "$deps\include" -Recurse -Force
          $prefix = $deps -replace '\\','/'
          $pc = @(
            "prefix=$prefix",
            'libdir=${prefix}/lib',
            'includedir=${prefix}/include',
            '',
            'Name: shaderc',
            'Description: shaderc from the Vulkan SDK',
            'Version: 2024.0',
            'Libs: -L${libdir} -lshaderc_shared',
            'Cflags: -I${includedir}'
          )
          Set-Content -Path "$deps\lib\pkgconfig\shaderc.pc" -Value $pc -Encoding ascii
          Get-Content "$deps\lib\pkgconfig\shaderc.pc"

      - name: Make build directory
        run: |
          mkdir build

      # vcpkg removed the x-gha binary cache that run-vcpkg defaults to, so keep
      # the built packages in a plain folder cached with actions/cache instead.
      - name: Set up vcpkg binary cache
        run: |
          $cache = "${{ github.workspace }}\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          echo "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-${{ runner.os }}-${{ env.triplet }}-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ runner.os }}-${{ env.triplet }}-${{ env.vcpkg_baseline }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      # Saved right away so later failures in the job still keep the packages.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-${{ runner.os }}-${{ env.triplet }}-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Fetch NVIDIA NGX SDK (RTX Video Super Resolution, DLSS Frame Generation)
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/NVIDIA/DLSS.git ngx-sdk
          cd ngx-sdk
          git sparse-checkout set --no-cone /include/ /lib/Windows_x86_64/x64/nvsdk_ngx_d.lib /lib/Windows_x86_64/rel/nvngx_dlssg.dll /LICENSE.txt
          git checkout
          if (-not (Test-Path "lib\Windows_x86_64\x64\nvsdk_ngx_d.lib")) { throw "NGX library missing" }
          if (-not (Test-Path "lib\Windows_x86_64\rel\nvngx_dlssg.dll")) { throw "DLSS Frame Generation runtime missing" }

      - name: Fetch AMD FidelityFX SDK (FSR 3.1 Frame Generation)
        run: |
          git clone --depth 1 --branch v1.1.4 --filter=blob:none --no-checkout https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ffx-sdk
          cd ffx-sdk
          git sparse-checkout set --no-cone /ffx-api/include/ /PrebuiltSignedDLL/amd_fidelityfx_vk.dll /LICENSE.txt
          git checkout
          if (-not (Test-Path "PrebuiltSignedDLL\amd_fidelityfx_vk.dll")) { throw "FidelityFX runtime missing" }

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DCHIAKI_ENABLE_NGX=ON `
          -DCHIAKI_NGX_SDK_DIR="${{ github.workspace }}\ngx-sdk" `
          -DCHIAKI_ENABLE_FFX=ON `
          -DCHIAKI_FFX_SDK_DIR="${{ github.workspace }}\ffx-sdk" `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir chiaki-ng-Win
          cp build\gui\chiaki.exe chiaki-ng-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll chiaki-ng-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          # Ship every runtime DLL vcpkg built; names change between vcpkg versions (e.g. lcms2).
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" chiaki-ng-Win
          # Frame generation runtimes (redistributable parts of the NVIDIA DLSS SDK and the AMD FidelityFX SDK)
          cp "${{ github.workspace }}\ngx-sdk\lib\Windows_x86_64\rel\nvngx_dlssg.dll" chiaki-ng-Win
          cp "${{ github.workspace }}\ffx-sdk\PrebuiltSignedDLL\amd_fidelityfx_vk.dll" chiaki-ng-Win
          mkdir chiaki-ng-Win\licenses
          cp "${{ github.workspace }}\ngx-sdk\LICENSE.txt" chiaki-ng-Win\licenses\NVIDIA-DLSS-SDK-LICENSE.txt
          cp "${{ github.workspace }}\ffx-sdk\LICENSE.txt" chiaki-ng-Win\licenses\AMD-FidelityFX-SDK-LICENSE.txt
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release chiaki-ng-Win\chiaki.exe

      - name: Package chiaki-ng
        run: |
          $CHIAKI_VERSION_MAJOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_MINOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MINOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_PATCH = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_PATCH ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $RELEASE_PACKAGE_FILE = "chiaki-ng-win_x64-VC-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          Compress-Archive chiaki-ng-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-Release
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 7
