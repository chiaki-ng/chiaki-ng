name: Apply PS5 Remoto display name

on:
  push:
    branches: [feature/sharpening]
    paths:
      - ".github/workflows/rename-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible application name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gui/src/main.cpp")
          source = path.read_text(encoding="utf-8")
          replacements = [
              ('QGuiApplication::setApplicationDisplayName("chiaki-ng");', 'QGuiApplication::setApplicationDisplayName("PS5 Remoto");'),
              ('QString("chiaki-ng:%1").arg(settings.GetCurrentProfile())', 'QString("PS5 Remoto:%1").arg(settings.GetCurrentProfile())'),
              ('SDL_SetHint(SDL_HINT_APP_NAME, "chiaki-ng");', 'SDL_SetHint(SDL_HINT_APP_NAME, "PS5 Remoto");'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/rename-app.yml
      - name: Commit the rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use PS5 Remoto as the display name"
          git push
