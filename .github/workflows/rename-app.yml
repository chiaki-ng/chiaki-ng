name: Clean up temporary rename workflow

on:
  push:
    branches: [feature/sharpening]
    paths:
      - ".github/workflows/rename-app.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        run: rm .github/workflows/rename-app.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary rename workflow"
          git push
